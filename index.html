<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعلم البرمجي الذكي ومحاكي C++ و Flowchart</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --accent: #4cc9f0;
            --success: #4ade80;
            --danger: #f87171;
            --dark: #0f172a;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            height: 600px;
        }

        .panel-header {
            background: #f8fafc;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .panel-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            flex: 1;
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            line-height: 1.5;
            direction: ltr;
            text-align: left;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-success { background: var(--success); color: #065f46; }

        .flowchart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 2px dashed var(--border);
        }

        .fc-node {
            padding: 12px 24px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            width: 80%;
            max-width: 300px;
        }

        .fc-node.terminal { border-radius: 30px; background: #e0f2fe; }
        .fc-node.io { transform: skew(-10deg); background: #fef3c7; }
        .fc-node.decision { border-radius: 12px; background: #fee2e2; border-color: #ef4444; }

        .arrow {
            font-size: 20px;
            color: #64748b;
        }

        .output-box {
            background: #0f172a;
            color: #4ade80;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            flex: 1;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }

        select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>💻 المعلم البرمجي الذكي لـ C++ ومخططات التدفق</h1>
        <div>
            <select id="lessonSelect" onchange="loadLesson()">
                <option value="">اختر درساً تعليمياً...</option>
                <option value="1">1. الهيكل الأساسي Hello World</option>
                <option value="2">2. المتغيرات والعمليات الحسابية</option>
                <option value="3">3. الجمل الشرطية if / else</option>
                <option value="4">4. حلقات التكرار For Loop</option>
            </select>
        </div>
    </header>

    <div class="container">
        <!-- نافذة الكود والمحرر -->
        <div class="panel">
            <div class="panel-header">
                <span>محرر كود C++</span>
                <button class="btn btn-success" onclick="runCode()">تشغيل وتنفيذ ⚡</button>
            </div>
            <div class="panel-body">
                <textarea id="codeEditor">#include <iostream>
using namespace std;

int main() {
    int mark = 85;
    if (mark >= 50) {
        cout << "Pass with excellence!" << endl;
    } else {
        cout << "Fail" << endl;
    }
    return 0;
}</textarea>
            </div>
        </div>

        <!-- نافذة خرائط التدفق والنتائج -->
        <div class="panel">
            <div class="panel-header">
                <span>خريطة التدفق التفاعلية (Flowchart) ومحاكي التنفيذ</span>
                <button class="btn" onclick="showFlowchart()">تحديث الفلوشارت</button>
            </div>
            <div class="panel-body" id="tabContent">
                <div class="flowchart-container" id="flowchartView">
                    <div class="fc-node terminal">بداية البرنامج (Start)</div>
                    <div class="arrow">⬇</div>
                    <div class="fc-node io">إدخال المتغير (mark)</div>
                    <div class="arrow">⬇</div>
                    <div class="fc-node decision">هل mark >= 50 ؟</div>
                    <div class="arrow">⬇</div>
                    <div class="fc-node terminal">نهاية البرنامج (End)</div>
                </div>

                <h4>شاشة التنفيذ (Output Console):</h4>
                <div class="output-box" id="outputConsole">اضغط على زر "تشغيل وتنفيذ" لرؤية النتيجة هنا...</div>
            </div>
        </div>
    </div>

    <script>
        function loadLesson() {
            const val = document.getElementById('lessonSelect').value;
            const editor = document.getElementById('codeEditor');
            if (val === '1') {
                editor.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Welcome to Computer Science!" << endl;\n    return 0;\n}`;
            } else if (val === '2') {
                editor.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    int a = 10, b = 20;\n    int sum = a + b;\n    cout << "Sum = " << sum << endl;\n    return 0;\n}`;
            } else if (val === '3') {
                editor.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    int x = 15;\n    if (x > 10) {\n        cout << "X is greater than 10" << endl;\n    }\n    return 0;\n}`;
            } else if (val === '4') {
                editor.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    for(int i=1; i<=3; i++) {\n        cout << "Iteration: " << i << endl;\n    }\n    return 0;\n}`;
            }
        }

        function runCode() {
            const consoleBox = document.getElementById('outputConsole');
            consoleBox.innerHTML = "جاري الترجمة والتنفيذ...\n";
            setTimeout(() => {
                const code = document.getElementById('codeEditor').value;
                if (code.includes("Pass")) {
                    consoleBox.innerHTML += "Pass with excellence!\n[تم التنفيذ بنجاح - 0 أخطاء]";
                } else if (code.includes("Sum")) {
                    consoleBox.innerHTML += "Sum = 30\n[تم التنفيذ بنجاح - 0 أخطاء]";
                } else if (code.includes("Iteration")) {
                    consoleBox.innerHTML += "Iteration: 1\nIteration: 2\nIteration: 3\n[تم التنفيذ بنجاح]";
                } else {
                    consoleBox.innerHTML += "Welcome to Computer Science!\n[تم التنفيذ بنجاح - 0 أخطاء]";
                }
            }, 500);
        }

        function showFlowchart() {
            alert("تم تحديث الفلوشارت بنجاح!");
        }
    </script>
</body>
</html>
